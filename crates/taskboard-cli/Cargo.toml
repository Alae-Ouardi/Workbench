[package]
name = "taskboard-cli"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "taskboard"
path = "src/main.rs"

[dependencies]
taskboard-core = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
