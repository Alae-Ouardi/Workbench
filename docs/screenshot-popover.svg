  <text x="36" y="438" fill="#334155" font-size="9">#38</text>

  <rect x="316" y="416" width="36" height="16" rx="4" fill="#34d399" fill-opacity="0.1"/>
  <text x="334" y="427" fill="#34d399" font-size="8" text-anchor="middle" font-weight="500">Done</text>

