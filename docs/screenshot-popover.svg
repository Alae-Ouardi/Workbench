  <line x1="0" y1="530" x2="380" y2="530" stroke="#1c2230" stroke-width="1" opacity="0.4"/>
  <text x="16" y="546" fill="#334155" font-size="8">v0.2.3</text>
  <text x="364" y="546" fill="#334155" font-size="8" text-anchor="end">6 tasks</text>
