  <circle cx="24" cy="480" r="4" fill="#34d399"/>
  <text x="36" y="478" fill="#64748b" font-size="11" text-decoration="line-through">Wire event emission</text>
  <text x="36" y="494" fill="#334155" font-size="9">#39</text>

  <rect x="316" y="472" width="36" height="16" rx="4" fill="#34d399" fill-opacity="0.1"/>
  <text x="334" y="483" fill="#34d399" font-size="8" text-anchor="middle" font-weight="500">Done</text>

  <!-- ===== FOOTER ===== -->
