[workspace]
resolver = "2"
members = ["crates/taskboard-core", "crates/taskboard-cli", "src-tauri"]

[workspace.dependencies]
taskboard-core = { path = "crates/taskboard-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"

[profile.release]
strip = true
